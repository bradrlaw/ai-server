# Boot-time half of setup-firewall.sh's dead-man switch (ADR-0028). That script
# installs this as /etc/systemd/system/ufw.service.d/ai-fw-rollback.conf.
#
# A reboot or power loss inside the confirmation window kills the transient rollback
# timer and leaves the run's PENDING marker behind. Then, BEFORE ufw loads its rules,
# this restores the ufw config files from before that run. rollback.sh --boot only
# acts on a PENDING written in an EARLIER boot, so restarting ufw.service while a run
# is in progress changes nothing. If the restore fails, ufw.service fails and loads
# no rules: the host stays reachable (fix the cause, then
# sudo /bin/sh /etc/ufw/ai-fw-snapshot/rollback.sh). Without PENDING (or without the
# snapshot directory) this does nothing.
[Service]
ExecStartPre=/bin/sh -c 'if [ -e /etc/ufw/ai-fw-snapshot/PENDING ]; then exec /bin/sh /etc/ufw/ai-fw-snapshot/rollback.sh --boot; fi'
