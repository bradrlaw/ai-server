# Static viewer for the model-eval outputs (evals/). Renders HTML pages natively
# (summary.html, per-run run.html, and each model's index.html) — unlike
# Filebrowser, which only shows HTML source. Directory autoindex makes the tree
# browsable without knowing paths. Read-only, static, no auth (LAN/Tailscale).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Show a directory listing when no index.html is requested, so you can walk
    # evals/ -> <test>/ -> outputs/<model>/ and click into any page.
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Never treat a test's own index.html as the auto-served directory index —
    # keep the listing so every file (summary.html, raw.txt, meta.json) is
    # reachable. (There is no index.html at a test root anyway.)
    index  index.does-not-exist;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve JSON/text as inline UTF-8 so meta.json / raw.txt open in-browser.
    location ~* \.(json|txt)$ {
        default_type text/plain;
        charset utf-8;
    }
}
