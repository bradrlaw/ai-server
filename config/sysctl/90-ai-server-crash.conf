# Turn kernel faults into a fast reboot instead of a wedged headless box (ADR-0035).
# 2026-11-03: an MGLRU oops in kswapd0 left the machine hung until power-cycled.
kernel.panic_on_oops = 1
kernel.softlockup_panic = 1
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 300
# Reboot 10 s after a panic.
kernel.panic = 10
