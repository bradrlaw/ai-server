# Mode overlay: agentic
# ---------------------------------------------------------------------------
# Pure autonomous / agentic workloads: many unattended agents and their tool
# calls fanning out at once, favouring THROUGHPUT over a single huge context.
#
# Residency = matrix set `qg` (coding idx1 + gemma-26b idx2 + small idx0),
# so this mode loads `gemma-26b` on idx2 INSTEAD of `chat` (they share idx2 and
# evict each other). All three sit on separate cards → co-resident, no conflict.
#
#   * `coding` (Qwen3.8-27B Q6_K, idx1)  -> P=2, MTP off. Two slots for
#     concurrent automated coding tasks while each still gets a large window
#     (204800 / 2 = ~100k per slot). MTP off because on this build it doesn't
#     scale with --parallel: with MTP, coding stays at ~32-35 tok/s total however
#     many slots are busy (2026-08-24 sweep); without it P=2 gives ~22 (1 busy) /
#     ~37 (2 busy). It loads the base NVMe file (embedded MTP head unused). This
#     used to pin the pre-3.8 Qwen3.6-27B on the HDD cold tier — a stale model
#     the Qwen3.8 migration missed, and a slow switch.
#   * `gemma-26b` (Gemma-4-26B-A4B MoE, idx2) -> P=8. The throughput champ
#     (~281 tok/s aggregate @ P=8, ~19/32GB) blitzes through many focused,
#     small-context agent tasks (131072 / 8 = ~16k per slot).
#   * `small` (dense Gemma-4-12B, Titan X idx0) -> P=2 at ctx 65536 (32k/slot,
#     the same per-request window as daily, which clients assume). Fit-tested
#     with both slots full: peak 10308 of 12288 MiB (see heavy-coding.yaml). Drop
#     back to 24576 (12k/slot) if `small` returns to the 26B MoE on a 16 GB card.
#
# concurrencyLimit is raised above --parallel on each so bursts of agent
# requests queue instead of hitting llama-swap's default limit of 10 (HTTP 429).
# Sub-agent -> model binding is a CLIENT concern (e.g. Copilot SDK customAgents
# / harness config); this mode just makes the server ready to serve the fan-out.
name: agentic
label: "Agentic (autonomous multi-agent throughput)"
description: >
  Autonomous agent workloads: coding P=2 (~100k/slot) for concurrent automated
  coding, gemma-26b P=8 (~16k/slot, ~281 tok/s) for fast focused agent tasks,
  and small P=2 (32k/slot) on the Titan X. Loads gemma-26b in place of chat.
# No `model:` overrides: pools inherit the base (NVMe) model files, so a model
# migration in the base can't leave a mode serving a stale file.
overrides:
  coding:
    parallel: 2
    concurrencyLimit: 8
    ctx_size: 204800    # 204800 / 2 = ~100k/slot
    spec: none          # MTP off for the P=2 throughput pool (see above)
  gemma-26b:
    parallel: 8
    concurrencyLimit: 16
  small:
    parallel: 2
    ctx_size: 65536   # 65536 / 2 = 32k/slot (dense 12B on the Titan X; 24576 for the MoE on a 16 GB card)
    concurrencyLimit: 8
    spec: none   # no-op while the Titan X stopgap runs `small` without a draft; keeps the pool draft-free if it returns
# Warm all three so the whole agent worker set is ready immediately. gemma-26b
# is warmed here (not chat) — requesting it evicts chat from idx2.
preload:
  - coding
  - gemma-26b
  - small
