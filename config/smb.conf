#
# Samba config for the AI server (/srv/ai full share).
#
# Canonical, repo-tracked copy. Deploy with scripts/setup-samba.sh, which copies
# this to /etc/samba/smb.conf (backing up any existing file) and validates it
# with `testparm`. See docs/adr/0022-samba-share-srv-ai.md for rationale.
#
# Exposure (ADR-0022): loopback + Tailscale (tailscale0) + LAN (eno1) ONLY.
# `bind interfaces only = yes` keeps smbd off the docker/br-* bridges and off
# any future interface. Never expose port 445 to the public internet.
#
[global]
   workgroup = WORKGROUP
   server string = AI Server (%h)
   server role = standalone server
   map to guest = never
   restrict anonymous = 2

   # --- Protocol / crypto: SMB3 only, encryption required ---
   # Modern macOS Finder and Windows 10/11 both negotiate SMB3 + encryption.
   # If a client ever fails to mount, relax `smb encrypt` to `desired`.
   server min protocol = SMB3_11
   smb encrypt = required

   # --- Interface binding: loopback + tailnet + LAN only ---
   bind interfaces only = yes
   interfaces = lo tailscale0 eno1

   # --- Logging ---
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

   # --- Headless server: no printer sharing ---
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # --- macOS Finder interop (vfs_fruit) ---
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[srv-ai]
   comment = /srv/ai (full AI server tree)
   path = /srv/ai
   browseable = yes
   read only = no
   valid users = brad
   create mask = 0664
   directory mask = 0775
   # Order matters: catia -> fruit -> streams_xattr
   vfs objects = catia fruit streams_xattr
