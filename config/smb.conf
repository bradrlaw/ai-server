#
# Samba config for the AI server (/srv/ai full share).
#
# Canonical, repo-tracked copy. Deploy with scripts/setup-samba.sh, which copies
# this to /etc/samba/smb.conf (backing up any existing file) and validates it
# with `testparm`. See docs/adr/0022-samba-share-srv-ai.md for rationale.
#
# Exposure (ADR-0022): loopback + LAN + tailnet ONLY. smbd listens on every
# address (port 445) and `hosts allow` admits only those sources; ufw
# (ADR-0028) is the outer layer. Never expose port 445 to the public internet.
#
[global]
   workgroup = WORKGROUP
   server string = AI Server (%h)
   server role = standalone server
   map to guest = never
   restrict anonymous = 2

   # --- Protocol / crypto: SMB3 only, encryption required ---
   # Modern macOS Finder and Windows 10/11 both negotiate SMB3 + encryption.
   # If a client ever fails to mount, relax `smb encrypt` to `desired`.
   server min protocol = SMB3_11
   smb encrypt = required

   # --- Listening + access control (ADR-0022, 2026-10-15 addendum) ---
   # NOT `bind interfaces only = yes`: Samba silently skips tailscale0 (a
   # point-to-point interface without the broadcast flag), so SMB never
   # listened on the tailnet; and smbd binds addresses only at startup, so the
   # rotating IPv6 privacy addresses on eno1 left it on stale ones. Listen on
   # all addresses instead and filter the SOURCE (checked per connection,
   # before authentication):
   #   127.0.0.1 ::1      loopback
   #   192.168.4.0/22     LAN IPv4 (eno1)
   #   100.64.0.0/10      tailnet IPv4
   #   fc00::/7           ULA: the LAN prefix (router-assigned) + the tailnet's
   #                      fd7a:115c:a1e0::/48; ufw narrows it to the LAN prefix
   #   fe80::/10          IPv6 link-local
   # Docker networks (172.16.0.0/12) are left out on purpose, and ufw rejects
   # container -> host 445 as well. `interfaces` no longer controls listening;
   # it only scopes the addresses advertised for SMB3 multichannel. Port 139
   # (NetBIOS session) is off; nmbd is disabled anyway.
   bind interfaces only = no
   interfaces = lo eno1
   smb ports = 445
   hosts allow = 127.0.0.1 ::1 192.168.4.0/22 100.64.0.0/10 fc00::/7 fe80::/10
   hosts deny = ALL

   # --- Logging ---
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

   # --- Headless server: no printer sharing ---
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # --- macOS Finder interop (vfs_fruit) ---
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[srv-ai]
   comment = /srv/ai (full AI server tree)
   path = /srv/ai
   browseable = yes
   read only = no
   valid users = brad
   create mask = 0664
   directory mask = 0775
   # Order matters: catia -> fruit -> streams_xattr
   vfs objects = catia fruit streams_xattr

   # --- Hidden credential stores (ADR-0022, 2026-10-16 addendum) ---
   # Vetoed names are invisible AND unopenable over SMB: listing, open, create
   # and rename-to all answer "not found". Samba matches each path COMPONENT
   # by name (case-insensitive, `*`/`?` wildcards, any depth), so nothing
   # under a vetoed folder is reachable, also not through a symlink into it.
   # It is name-based, not path-based: a copy or hardlink under another name
   # is NOT hidden, nor is a symlink with an innocent name pointing straight
   # AT a hidden item (none exist; SMB clients can't create symlinks;
   # scripts/verify-smb-veto.py checks). Every same-named item is hidden too
   # (docker/hermes/ template, comfyui/backups/ snapshot lists, other `state`
   # dirs). SSH sees everything.
   #   .env                docker/.env (gateway keys/tokens)
   #   server-status.env   status service's Open WebUI API key
   #   auth.json           status dashboard password hash
   #   PASSWORD .secret-key.txt   ComfyUI-Login (all instances)
   #   aitk_db.db*         ai-toolkit UI database (+ -wal/-shm: holds the HF token)
   #   auth-secrets state  openclaw/ credentials and device identity
   #   openclaw.bak-*      copies of the above from upgrades
   #   hermes              Hermes home (config holds a LiteLLM key, pairings)
   #   backups             any backup folder (dumps hold keys, tokens, chats);
   #                       put future backups in one, e.g. storage-bulk/backups/
   #   comfyui_*.log       ComfyUI-Manager logs (the secure instance logs its
   #                       API token on every start)
   #   storage             the encrypted volume while unlocked
   #   input-secure output-secure temp-secure   ComfyUI's links into storage/
   veto files = /.env/server-status.env/auth.json/PASSWORD/.secret-key.txt/aitk_db.db*/auth-secrets/state/hermes/openclaw.bak-*/backups/comfyui_*.log/storage/input-secure/output-secure/temp-secure/
   # A folder holding vetoed items can't be deleted over SMB (the default,
   # pinned): `yes` would silently delete the hidden items with it.
   delete veto files = no
